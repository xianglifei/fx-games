<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="番茄钟：专注 25 分钟，休息 10 分钟，热力图与时间线把一天的时间看得见。">
<title>番茄钟 · 专注与休息</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍅%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f2ea;
  --card:#ffffff;
  --ink:#3d3229;
  --muted:#a1968a;
  --line:#f0e9df;
  --work:#e0533d;
  --rest:#2b9f84;
  --empty:#ece6dd;
  --work-1:#f8cfc7;--work-2:#ef9384;--work-3:#e0533d;
  --rest-1:#cdeee2;--rest-2:#7fcab5;--rest-3:#2b9f84;
  --shadow:0 2px 14px rgba(61,50,41,.07);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(1200px 400px at 50% -100px,#fdf0e4 0%,rgba(253,240,228,0) 70%);
  color:var(--ink);
  min-height:100vh;
  line-height:1.5;
}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px calc(32px + env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:22px}
header h1{font-size:clamp(24px,6vw,30px);letter-spacing:1px}
header .sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{
  background:var(--card);border:1px solid rgba(61,50,41,.05);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px 18px;margin-bottom:16px;
}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.card-head h2{font-size:15px;font-weight:600;color:var(--ink)}
.now-clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 计时区 ---------- */
.idle-panel{display:flex;gap:12px}
.btn{
  flex:1;border:none;cursor:pointer;font-family:inherit;
  font-size:16px;font-weight:600;color:#fff;border-radius:14px;
  padding:18px 10px;transition:transform .12s ease,box-shadow .12s ease;
  touch-action:manipulation;
}
.btn:active{transform:scale(.97)}
.btn-work{background:linear-gradient(160deg,#e8684f,var(--work));box-shadow:0 4px 14px rgba(224,83,61,.32)}
.btn-rest{background:linear-gradient(160deg,#3ab394,var(--rest));box-shadow:0 4px 14px rgba(43,159,132,.30)}
.btn-work:hover,.btn-rest:hover{transform:translateY(-1px)}
.btn-ghost{
  flex:none;background:none;color:var(--muted);font-weight:500;
  border:1px solid var(--line);box-shadow:none;padding:10px 22px;font-size:14px;
}
.btn-ghost:hover{color:var(--ink);border-color:#ddd2c4;transform:none}
.run-panel{text-align:center;padding:10px 0 6px}
.run-panel .mode-line{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.tag{font-size:13px;font-weight:600;color:#fff;border-radius:999px;padding:3px 14px}
.tag.work{background:var(--work)}
.tag.rest{background:var(--rest)}
.mode-hint{font-size:13px;color:var(--muted)}
.countdown{
  font-size:clamp(64px,16vw,92px);font-weight:700;letter-spacing:2px;
  font-variant-numeric:tabular-nums;line-height:1.2;
  margin-bottom:10px;
  transition:color .3s;
}
.countdown.work{color:var(--work)}
.countdown.rest{color:var(--rest)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 20px}
.progress > div{height:100%;width:0%;border-radius:3px;background:var(--work);transition:width .3s linear,background .3s}
.progress > div.rest{background:var(--rest)}

/* ---------- 热力图 ---------- */
.date-nav{display:flex;align-items:center;gap:2px}
.nav-btn{
  width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;
  background:transparent;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
  touch-action:manipulation;
}
.nav-btn:hover:not(:disabled){background:var(--line);color:var(--ink)}
.nav-btn:active:not(:disabled){transform:scale(.92)}
.nav-btn:disabled{opacity:.25;cursor:default}
.date-label{
  font-size:15px;font-weight:600;min-width:118px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.hm-hours{
  display:grid;grid-template-columns:repeat(24,1fr);gap:2px;
  margin-bottom:4px;
}
.hm-hours span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.hm-hours span.cur{color:var(--work);font-weight:700}
/* 窄屏列太窄，非整点数字隐藏占位，避免挤成一团（visibility 保持网格结构不塌） */
@media (max-width:480px){
  .hm-hours span.min{visibility:hidden}
}
.hm-grid{
  display:grid;grid-template-columns:repeat(24,1fr);gap:2px;
  position:relative;
}
.cell{
  aspect-ratio:1/1;border-radius:3px;background:var(--empty);
  transition:background .35s;
}
.cell.work1{background:var(--work-1)}
.cell.work2{background:var(--work-2)}
.cell.work3{background:var(--work-3)}
.cell.rest1{background:var(--rest-1)}
.cell.rest2{background:var(--rest-2)}
.cell.rest3{background:var(--rest-3)}
.cell.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.legend{
  display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;
  font-size:12px;color:var(--muted);
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw-empty{background:var(--empty)}
.sw-work{background:var(--work-3)}
.sw-rest{background:var(--rest-3)}
.sw-live{background:var(--work-3);animation:pulse 1.6s ease-in-out infinite}
.tooltip{
  position:fixed;z-index:30;pointer-events:none;
  background:rgba(51,42,34,.92);color:#fff;font-size:12px;
  padding:4px 9px;border-radius:7px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

/* ---------- 时间线 ---------- */
.today-summary{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.timeline{list-style:none}
.timeline li{
  display:flex;flex-direction:column;gap:5px;
  padding:9px 2px;border-bottom:1px dashed var(--line);
}
.timeline li:last-child{border-bottom:none}
.tl-main{display:flex;align-items:center;gap:9px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.work{background:var(--work)}
.dot.rest{background:var(--rest)}
.tl-range{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-note-btn{
  flex:none;width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;
  background:transparent;color:#c9bfb1;position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s;touch-action:manipulation;
}
.tl-note-btn:hover{background:var(--line);color:var(--ink)}
.tl-note-btn .badge{
  position:absolute;top:-3px;right:-4px;min-width:14px;height:14px;border-radius:7px;
  background:var(--work);color:#fff;font-size:9px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  font-variant-numeric:tabular-nums;
}
.tl-note-btn.rest .badge{background:var(--rest)}
.tl-notes{display:flex;flex-direction:column;gap:3px}
.tl-note{
  font-size:12px;color:#8d8175;line-height:1.5;padding-left:8px;
  border-left:2px solid var(--line);margin-left:18px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-wrap;word-break:break-word;
}
.empty-tip{color:var(--muted);font-size:13px;text-align:center;padding:14px 0 6px}

/* ---------- 今日工作总结 ---------- */
#reportCard .card-head{margin-bottom:8px}
.rp-refresh{
  flex:none;width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;
  background:transparent;color:#c9bfb1;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s;touch-action:manipulation;
}
.rp-refresh:hover{background:var(--line);color:var(--ink)}
.rp-refresh:active{transform:scale(.92)}
.rp-refresh.spin svg{animation:rp-spin 1s linear infinite}
@keyframes rp-spin{to{transform:rotate(360deg)}}
.rp-meta{font-size:12px;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
.rp-body{font-size:13.5px;line-height:1.85;color:#6f6357;white-space:pre-wrap;word-break:break-word}
.rp-empty{font-size:13px;color:var(--muted)}

footer{text-align:center;color:#bdb2a4;font-size:12px;margin-top:6px}
footer a, .auth-switch a{color:#b09a86;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
footer a:hover, .auth-switch a:hover{color:var(--work)}

/* ---------- 登录/注册模态框 ---------- */
.modal-mask{
  position:fixed;inset:0;z-index:50;
  background:rgba(61,50,41,.38);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;transition:opacity .2s;
}
.modal-mask.show{opacity:1}
.modal{
  background:var(--card);border-radius:20px;box-shadow:0 12px 40px rgba(61,50,41,.22);
  width:min(330px,100%);padding:26px 24px 18px;position:relative;
  transform:translateY(10px) scale(.97);transition:transform .2s;
}
.modal-mask.show .modal{transform:none}
.modal-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  border:none;border-radius:9px;background:transparent;color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--line);color:var(--ink)}
.modal h3{font-size:18px;margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{
  width:100%;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;font-family:inherit;color:var(--ink);
  background:#fff;outline:none;transition:border-color .15s;
}
.field input:focus{border-color:#e5b7a9}
.auth-error{font-size:12px;color:var(--work);margin:-2px 0 10px}
.btn-block{width:100%;padding:12px;font-size:15px;margin-top:2px}
.auth-switch{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.auth-note{font-size:11px;color:#c9bfb1;text-align:center;margin-top:6px}
.note-input{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font-size:14px;font-family:inherit;color:var(--ink);line-height:1.5;
  resize:vertical;min-height:88px;outline:none;background:#fff;
  transition:border-color .15s;
}
.note-input:focus{border-color:#e5b7a9}
.note-count{text-align:right;font-size:11px;color:var(--muted);margin:4px 0 10px;font-variant-numeric:tabular-nums}

#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px);
  background:rgba(51,42,34,.92);color:#fff;font-size:14px;
  padding:10px 18px;border-radius:12px;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:420px){
  .card{padding:16px 12px}
  .btn{font-size:15px;padding:16px 6px}
}
@media (prefers-reduced-motion:reduce){
  .cell.live,.sw-live{animation:none}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>🍅 番茄钟</h1>
    <p class="sub">专注 25 分钟 · 休息 10 分钟，把时间看得见</p>
  </header>

  <section class="card">
    <div id="idlePanel" class="idle-panel">
      <button id="btnWork" class="btn btn-work">🍅 工作 25 分钟</button>
      <button id="btnRest" class="btn btn-rest">🌿 休息 10 分钟</button>
    </div>
    <div id="runPanel" class="run-panel" hidden>
      <div class="mode-line">
        <span id="modeTag" class="tag work">工作</span>
        <span id="modeHint" class="mode-hint">专注中，加油！</span>
      </div>
      <div id="countdown" class="countdown work">25:00</div>
      <div class="progress"><div id="progressBar"></div></div>
      <button id="btnStop" class="btn btn-ghost">结束本轮</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="date-nav">
        <button id="prevDay" class="nav-btn" aria-label="前一天">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M6.5 1L2.5 5l4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="dateLabel" class="date-label">今天</span>
        <button id="nextDay" class="nav-btn" aria-label="后一天" disabled>
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M3.5 1l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <span id="nowClock" class="now-clock"></span>
    </div>
    <div id="hmHours" class="hm-hours"></div>
    <div id="hmGrid" class="hm-grid"></div>
    <div class="legend">
      <span><i class="sw sw-empty"></i>空闲</span>
      <span><i class="sw sw-work"></i>工作</span>
      <span><i class="sw sw-rest"></i>休息</span>
      <span><i class="sw sw-live"></i>进行中</span>
      <span style="margin-left:auto">每格 5 分钟 × 288 格</span>
    </div>
  </section>

  <section class="card" id="reportCard" hidden>
    <div class="card-head">
      <h2 id="rpTitle">今日工作总结</h2>
      <button id="rpRefresh" class="rp-refresh" aria-label="立即重新生成" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
    <p id="rpMeta" class="rp-meta" hidden></p>
    <div id="rpBody" class="rp-body"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 id="tlTitle">今日时间线</h2>
      <span id="todaySummary" class="today-summary"></span>
    </div>
    <ul id="timeline" class="timeline"></ul>
    <p id="emptyTip" class="empty-tip">今天还没有记录，点上面的按钮开始第一轮吧 ☀️</p>
  </section>

  <footer id="foot">数据只保存在你的浏览器本地，不会上传</footer>
</main>

<div id="authModal" class="modal-mask" hidden>
  <div class="modal">
    <button id="authClose" class="modal-close" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <h3 id="authTitle">登录</h3>
    <p class="auth-sub">登录后，记录自动同步到云端，多台电脑共用</p>
    <form id="authForm" autocomplete="on">
      <label class="field" id="nickField" hidden>
        <span>昵称</span>
        <input id="nickInput" maxlength="16" placeholder="页面上显示的名字" autocomplete="nickname">
      </label>
      <label class="field">
        <span>邮箱</span>
        <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="pwdInput" type="password" placeholder="至少 6 位" autocomplete="current-password">
      </label>
      <label class="field" id="pwd2Field" hidden>
        <span>再输一遍密码</span>
        <input id="pwd2Input" type="password" placeholder="两次要一致" autocomplete="new-password">
      </label>
      <p id="authError" class="auth-error" hidden></p>
      <button id="authSubmit" type="submit" class="btn btn-work btn-block">登录</button>
    </form>
    <p class="auth-switch"><span id="authSwitchText">没有账号？</span><a id="authSwitch">注册一个</a></p>
    <p class="auth-note" id="authNote" hidden>忘记密码请联系管理员重置</p>
  </div>
</div>

<div id="noteModal" class="modal-mask" hidden>
  <div class="modal">
    <button id="noteClose" class="modal-close" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <h3>记录一下</h3>
    <p class="auth-sub" id="noteCtx"></p>
    <textarea id="noteInput" class="note-input" maxlength="200" rows="4" placeholder="这段时间做了什么？"></textarea>
    <div class="note-count"><span id="noteCount">0</span>/200</div>
    <button id="noteSave" type="button" class="btn btn-work btn-block">记下</button>
    <button id="noteDone" type="button" class="btn btn-ghost btn-block" style="margin-top:8px">完成</button>
  </div>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast"></div>

<script>
'use strict';
(function(){
  const $ = s => document.querySelector(s);

  const WORK_MIN = 25, REST_MIN = 10;
  const SLOT_MS = 5 * 60 * 1000;          // 热力图一格 = 5 分钟
  const SLOTS_PER_HOUR = 12;
  const DAY_SLOTS = 24 * SLOTS_PER_HOUR;  // 288 格
  const STORE_KEY = 'letsfarm.pomodoro.v1';
  const MIN_RECORD_MS = 60 * 1000;        // 不足 1 分钟不记录

  const MODES = {
    work: { label: '工作', verb: '工作中', hint: '专注中，加油！',  min: WORK_MIN },
    rest: { label: '休息', verb: '休息中', hint: '喝口水，放松一下～', min: REST_MIN },
  };

  // ---------- 状态与持久化 ----------
  let state = { session: null, records: [], notes: [] };   // notes: 追加式备注 {id, rid, text, at}
  let viewTs = null;   // 当前查看的日期（当天零点时间戳），null 初始化为今天

  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.records)) state.records = data.records;
      if(data && Array.isArray(data.notes)) state.notes = data.notes;
      if(data && data.session && MODES[data.session.type]) state.session = data.session;
    }catch(e){}
  }

  // ---------- 音效（WebAudio 合成，无音频文件） ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, at, dur, type, vol){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + at;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function chime(kind){
    if(!audioCtx) return;
    if(kind === 'work'){         // 清脆三连上行：C5 E5 G5
      tone(523.25, 0.00, 0.18, 'sine', 0.22);
      tone(659.25, 0.20, 0.18, 'sine', 0.22);
      tone(783.99, 0.40, 0.30, 'sine', 0.24);
    }else{                        // 柔和双音：G4 C5
      tone(392.00, 0.00, 0.28, 'triangle', 0.16);
      tone(523.25, 0.26, 0.42, 'triangle', 0.16);
    }
  }

  // ---------- 时间工具 ----------
  const pad = n => String(n).padStart(2, '0');
  function fmtClock(ts){
    const d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtMMSS(ms){
    const s = Math.max(0, Math.ceil(ms / 1000));
    return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function fmtMin(ms){ return Math.round(ms / 60000); }

    const d = new Date(ts === undefined ? Date.now() : ts);

  // 本地日期键 YYYY-MM-DD（日报按本地日历日查询）

  // slot 的时间范围文案，如 14:35 – 14:40（最后一格终点显示 24:00）
  function slotRange(idx, dayStart){
    const endTs = dayStart + (idx + 1) * SLOT_MS;

  }

  function dispMin(ms){ return Math.max(1, fmtMin(ms)); }

  // ---------- 查看日期 ----------
  function isTodayView(){ return viewTs === todayStart(); }
  function shortDay(ts){
    const d = new Date(ts), n = new Date();
    const md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return d.getFullYear() === n.getFullYear() ? md : d.getFullYear() + '年' + md;
  }
  function fmtDayLabel(ts){
    const diff = Math.round((todayStart() - ts) / 86400000);
    const md = shortDay(ts);
    if(diff === 0) return '今天 · ' + md;
    if(diff === 1) return '昨天 · ' + md;
    if(diff === 2) return '前天 · ' + md;
    const week = ['日','一','二','三','四','五','六'][new Date(ts).getDay()];
    return md + ' · 周' + week;
  }

  // ---------- 热力图：把记录铺进 288 个 5 分钟格子 ----------
  let lastSlots = [];
  function buildSlots(dayStart){
    const slots = Array.from({ length: DAY_SLOTS }, () => ({ work: 0, rest: 0 }));
    const dayEnd = dayStart + 24 * 3600 * 1000;
    const sources = state.records.slice();
    // 进行中的一轮只在「今天」视图里实时叠加
    if(state.session && dayStart === todayStart()){
      sources.push({ type: state.session.type, start: state.session.start, end: Math.min(Date.now(), state.session.end) });
    }
    for(const rec of sources){
      const s = Math.max(rec.start, dayStart), e = Math.min(rec.end, dayEnd);
      if(e <= s) continue;
      let i = Math.floor((s - dayStart) / SLOT_MS);
      const last = Math.min(DAY_SLOTS - 1, Math.floor((e - dayStart - 1) / SLOT_MS));
      for(; i <= last; i++){
        const slotStart = dayStart + i * SLOT_MS;
        const ov = Math.min(e, slotStart + SLOT_MS) - Math.max(s, slotStart);
        if(ov > 0) slots[i][rec.type] += ov;

  }
  function slotClass(s){

    return ' ' + type + lv;
  }

  // ---------- 时间线 ----------

  // ---------- 「记录一下」弹窗（追加式，可连续记多条） ----------
  const noteModal = $('#noteModal'), noteInput = $('#noteInput'), noteCtx = $('#noteCtx'), noteCount = $('#noteCount');

  noteInput.addEventListener('input', () => { noteCount.textContent = String(noteInput.value.length); });
  noteInput.addEventListener('keydown', e => {

  });

  // ---------- 计时面板 ----------
  function renderTimerPanel(){
    const s = state.session;

  function updateLiveCell(){
    if(liveSlot >= 0 && cellBySlot[liveSlot]){
      cellBySlot[liveSlot].classList.remove('live');
      liveSlot = -1;
    }
    if(!state.session || !isTodayView()) return;
    const idx = Math.floor((Date.now() - todayStart()) / SLOT_MS);
    if(idx >= 0 && idx < DAY_SLOTS && cellBySlot[idx]){
      cellBySlot[idx].classList.add('live');

  // ---------- 主循环（剩余时间一律用时间戳算，后台节流/刷新都不漂移） ----------
  let lastKnownToday = todayStart();
  function tick(){
    const now = Date.now();
    // 跨午夜：停在「今天」视图时自动跟随翻到新的一天；正在浏览历史则不打扰
    const realToday = todayStart();
    if(realToday !== lastKnownToday){
      const wasToday = viewTs === lastKnownToday;
      lastKnownToday = realToday;
      if(wasToday){ viewTs = realToday; renderAll(); fetchReport(); }
    }
    const isToday = isTodayView();
    nowClock.hidden = !isToday;
    if(isToday) nowClock.textContent = '现在 ' + fmtClock(now);
    const s = state.session;
    if(s){
      const remain = s.end - now;
      if(remain <= 0){ finish(true); return; }
      countdownEl.textContent = fmtMMSS(remain);
      document.title = fmtMMSS(remain) + ' · ' + MODES[s.type].verb;
      const total = s.end - s.start;
      progressBar.style.width = Math.min(100, (total - remain) / total * 100) + '%';

      if(mark !== liveMark){
        liveMark = mark;
        renderHeatmap();   // 全量重铺：把走过的格子固化、当前格按已覆盖分钟加深

  }

  // ---------- 开始 / 结束 ----------
  function start(type){

    state.session = { type: type, start: now, end: now + MODES[type].min * 60000 };

  function finish(natural){
    const s = state.session;

      state.records.push({ type: s.type, start: s.start, end: end });

            (natural ? '' : '（提前结束）'));

    if(natural){ ensureAudio(); chime(s.type); }

  }

  function recover(){

  // ---------- 账号与云同步 ----------
  const SYNC_API = 'https://pomodoro-api.xianglifei.workers.dev';
  const TZ_NAME = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai';   // 同步时上报纸时区，日报按本地日归档
  const AUTH_KEY = 'letsfarm.pomodoro.auth';
  const KDF_SALT = 'letsfarm.pomodoro.v1';   // 与 api/worker.js 保持一致
  let auth = null;        // {token, email, nickname}
  let lastSyncAt = null;

  const authModal = $('#authModal'), authTitle = $('#authTitle'), authError = $('#authError');
  const nickField = $('#nickField'), nickInput = $('#nickInput'), pwd2Field = $('#pwd2Field'), pwd2Input = $('#pwd2Input');
  const emailInput = $('#emailInput'), pwdInput = $('#pwdInput');
  const authSubmit = $('#authSubmit'), authSwitch = $('#authSwitch'), authSwitchText = $('#authSwitchText'), authNote = $('#authNote');
  let authMode = 'login';

  function loadAuth(){
    try{ auth = JSON.parse(localStorage.getItem(AUTH_KEY)) || null; }catch(e){ auth = null; }
    if(auth && (!auth.token || !auth.nickname)) auth = null;

    try{

  const esc = s => String(s).replace(/[&<>"']/g,

  function renderFooter(){

  function openAuth(mode){

  async function derivePwd(password){
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(KDF_SALT), iterations: 210000 },
      key, 256);
    return btoa(String.fromCharCode(...new Uint8Array(bits)));
  }

  async function submitAuth(){
    const email = emailInput.value.trim().toLowerCase();
    const pwd = pwdInput.value;
    const nickname = nickInput.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ return showAuthError('邮箱格式好像不对'); }
    if(pwd.length < 6){ return showAuthError('密码至少 6 位'); }
    if(authMode === 'register'){
      if(nickname.length < 1 || nickname.length > 16){ return showAuthError('昵称需要 1–16 个字'); }
      if(pwd !== pwd2Input.value){ return showAuthError('两次输入的密码不一致'); }
    }
    authSubmit.disabled = true;
    authSubmit.textContent = authMode === 'login' ? '登录中…' : '注册中…';
    try{
      const derived = await derivePwd(pwd);
      const body = authMode === 'register' ? { email, nickname, derived } : { email, derived };
      const r = await fetch(SYNC_API + (authMode === 'register' ? '/register' : '/login'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const j = await r.json().catch(() => ({}));
      if(!r.ok){ showAuthError(j.error || '网络不太好，稍后再试'); return; }
      auth = { token: j.token, email: j.email, nickname: j.nickname };
      saveAuth();
      lastSyncAt = null;
      closeAuth();
      renderFooter();
      toast('欢迎回来，' + auth.nickname + '，正在同步…');
      // 推送即双向：上传本地全量（老用户先积累的记录此刻上云），同时拿回云端全量合并
      syncNow('push');
      reportCache.clear();   // 换账号后重新拉日报
      renderReport();
      fetchReport();
    }catch(e){
      showAuthError('连不上服务器，检查一下网络');
    }finally{
      authSubmit.disabled = false;
      authSubmit.textContent = authMode === 'login' ? '登录' : '注册并登录';
    }
  }
  function showAuthError(msg){

    authError.hidden = false;
  }

  function logout(msg){
    auth = null;
    lastSyncAt = null;

  // 数据合并：records 与 notes 各自按天然主键求并集（append-only，无冲突）
  function mergeRecords(data){
    let changed = false;
    const remoteRecs = Array.isArray(data && data.records) ? data.records : [];
    const remoteNotes = Array.isArray(data && data.notes) ? data.notes : [];

    if(remoteRecs.length){
      const key = r => r.type + ':' + r.start + ':' + r.end;
      const map = new Map(state.records.map(r => [key(r), r]));
      for(const r of remoteRecs){
        if(!map.has(key(r))){ map.set(key(r), r); changed = true; }
      }
      state.records = [...map.values()].sort((a, b) => a.start - b.start);
    }
    if(remoteNotes.length){
      const nmap = new Map(state.notes.map(n => [n.id, n]));
      for(const n of remoteNotes){
        if(!nmap.has(n.id) && n && n.id && n.rid && typeof n.text === 'string'){ nmap.set(n.id, n); changed = true; }
      }
      state.notes = [...nmap.values()].sort((a, b) => a.at - b.at);
    }
    if(changed){
      save();
      renderHeatmap();
      renderTimeline();
    }
  }

  let syncing = false;
  async function syncNow(direction){
    if(!auth || syncing) return;
    syncing = true;
    try{
      const headers = { Authorization: 'Bearer ' + auth.token };
      const opt = direction === 'push'
        ? { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({ records: state.records, notes: state.notes }) }
        : { headers };
      const r = await fetch(SYNC_API + '/sync?tz=' + encodeURIComponent(TZ_NAME), opt);
      if(r.status === 401){ logout('登录已过期，请重新登录'); return; }
      if(!r.ok) return;
      const data = await r.json();
      mergeRecords(data);
      lastSyncAt = Date.now();
      renderFooter();
    }catch(e){ /* 离线静默，下次时机再试 */ }
    finally{ syncing = false; }
  }

  let pushTimer = null;
  function schedulePush(){
    if(!auth) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => syncNow('push'), 2000);   // 防抖：连续多轮只推一次
  }

  // ---------- 今日工作总结（登录可见；云端 Cron 整点生成，未登录整个板块不出现） ----------
  const reportCard = $('#reportCard'), rpTitle = $('#rpTitle'), rpMeta = $('#rpMeta'),
        rpBody = $('#rpBody'), rpRefresh = $('#rpRefresh');
  const reportCache = new Map();   // dateKey → {content, note_count, generated_at} | null（当日无日报）
  let reportBusy = false, reportFetchedAt = 0;

  function renderReport(){
    if(!auth){ reportCard.hidden = true; return; }
    const key = dateKeyOf(viewTs), isToday = isTodayView();
    const rep = reportCache.get(key);
    if(!rep){
      // 历史日期没日报（上线前/当天没写备注）→ 板块不出现；今天给一句轻量空态，避免板块中途冒出来顶动布局
      if(isToday){
        reportCard.hidden = false;
        rpTitle.textContent = '今日工作总结';
        rpMeta.hidden = true;
        rpBody.innerHTML = '<p class="rp-empty">写下第一条备注后，每个整点会自动帮你总结今天</p>';
        rpRefresh.hidden = true;
      }else{
        reportCard.hidden = true;
      }
      return;
    }
    reportCard.hidden = false;
    rpTitle.textContent = isToday ? '今日工作总结' : shortDay(viewTs) + ' · 工作总结';
    rpMeta.hidden = false;
    rpMeta.textContent = fmtClock(rep.generated_at) + ' 生成 · 基于当日 ' + rep.note_count + ' 条备注';
    rpBody.textContent = rep.content;
    rpRefresh.hidden = !isToday;
  }

  async function fetchReport(){
    if(!auth || reportBusy) return;
    reportBusy = true;
    try{
      const key = dateKeyOf(viewTs);
      const r = await fetch(SYNC_API + '/report?date=' + key, { headers: { Authorization: 'Bearer ' + auth.token } });
      if(r.status === 401){ logout('登录已过期，请重新登录'); return; }
      if(!r.ok) return;
      const j = await r.json();
      if(j.date === key){ reportCache.set(key, j.report || null); renderReport(); }
      reportFetchedAt = Date.now();
    }catch(e){ /* 静默，下个整点轮询再拉 */ }
    finally{ reportBusy = false; }
  }

  rpRefresh.addEventListener('click', async () => {
    if(reportBusy) return;
    reportBusy = true;
    rpRefresh.classList.add('spin');
    try{
      const r = await fetch(SYNC_API + '/report/regenerate', { method: 'POST', headers: { Authorization: 'Bearer ' + auth.token } });
      if(r.status === 401){ logout('登录已过期，请重新登录'); return; }
      const j = await r.json().catch(() => ({}));
      if(r.ok && j.report){
        reportCache.set(j.date, j.report);
        renderReport();
        toast('已重新生成');
      }else{
        toast(j.error || '生成失败，稍后再试');
      }
    }catch(e){
      toast('连不上服务器，稍后再试');
    }finally{
      rpRefresh.classList.remove('spin');
      reportBusy = false;
    }
  });

  // ---------- 热力图 tooltip ----------
  hmGrid.addEventListener('pointermove', e => {
    const cell = e.target.closest('.cell');
    if(!cell){ tooltip.hidden = true; return; }
    const idx = +cell.dataset.slot;
    const s = lastSlots[idx] || { work: 0, rest: 0 };
    let label = '空闲';
    if(s.work > 0 && s.rest > 0) label = '工作 ' + dispMin(s.work) + ' 分钟 · 休息 ' + dispMin(s.rest) + ' 分钟';
    else if(s.work > 0) label = '工作 ' + dispMin(s.work) + ' 分钟';
    else if(s.rest > 0) label = '休息 ' + dispMin(s.rest) + ' 分钟';
    tooltip.textContent = slotRange(idx, viewTs) + ' · ' + label;
    tooltip.hidden = false;
    const pad2 = 10, w = tooltip.offsetWidth;
    let x = e.clientX + pad2;
    if(x + w > window.innerWidth - 6) x = e.clientX - w - pad2;
    tooltip.style.left = x + 'px';
    tooltip.style.top = Math.max(6, e.clientY - 34) + 'px';
  });
  hmGrid.addEventListener('pointerleave', () => { tooltip.hidden = true; });

  // ---------- 事件 ----------
  $('#btnWork').addEventListener('click', () => start('work'));
  $('#btnRest').addEventListener('click', () => start('rest'));
  $('#btnStop').addEventListener('click', () => finish(false));
  prevDayBtn.addEventListener('click', () => shiftDay(-1));
  nextDayBtn.addEventListener('click', () => shiftDay(1));
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) return;
    tick();
    if(auth && Date.now() - reportFetchedAt > 5 * 60 * 1000) fetchReport();   // 切回页面补拉最新日报
  });

  // ---------- 启动 ----------
  buildHeatmapDom();
  viewTs = todayStart();
  load();
  loadAuth();
  recover();
  renderAll();
  renderFooter();
  tick();
  setInterval(tick, 250);
  if(auth){
    syncNow('push');                                 // 打开即双向对齐：离线攒的记录先推上去，再拿回云端全量
    setInterval(() => syncNow('pull'), 5 * 60 * 1000); // 之后每 5 分钟轻量拉一次
    fetchReport();                                     // 打开即拉今日日报
    setInterval(() => { if(!document.hidden) fetchReport(); }, 60 * 60 * 1000);   // 每小时随 Cron 更新
  }
})();
</script>
</body>
</html>
