    background:repeating-linear-gradient(45deg,#faf6ee,#faf6ee 12px,#f4eee1 12px,#f4eee1 24px);

  .fig svg{filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));}
  .treerow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .grass{
    background:var(--ground,#6fae54);border-radius:6px;position:relative;overflow:hidden;flex:none;

</head>
<body>

<div class="banner">
  <h1>🏕️ 皮肤组合方案预览（仅供挑选，游戏未做任何改动）</h1>
  <p>把<b>草地色 + 木框色 + 数字徽章 + 树组 + 帐篷三件套</b>打包成整套皮肤，游戏内可像换装一样一键切换。每张卡片下方是一块 <b>6×6 真实比例</b>的主题棋盘。看完回我编号即可，比如「先上 肤3 和 肤4」；每个皮肤里的树、帐篷、配色也都可以单独微调。</p>
</div>

<div class="wrap" id="skins"></div>

<footer>
  💡 <b>实现方式（供参考）：</b>游戏的草地、木框、徽章本来就是几处颜色值，树和帐篷是 4 个 SVG 常量——做成皮肤只需按方案打包成"配色表 + 素材组"，加一个切换入口即可，<b>不碰任何玩法逻辑</b>。肤3 的金合欢树、肤4 的仙人掌和沙漠帐是新画的，其余全部来自你选中的设计。
</footer>

/* ============ 皮肤定义 ============ */
const CELL = 52;
const SKINS = [
{ id:"肤1", name:"森林营地（现行风格基准）",
  note:"你选的 树1松树 + 树2橡树 混植，配 帐1 橙色三角帐；草地木框徽章全部沿用现行配色",
  ground:"#6fae54", cellBorder:"rgba(255,255,255,.16)", cellBorder2:"rgba(0,0,0,.05)",
  frame:["#d2a371","#b07f4e"], chip:["#8a5e38","#75492a"], chipDone:["#4bb06b","#2f8a4e"],
  trees:["pine","oak"], boardTrees:["pine","oak","pine","oak","pine","oak"], tent:"orange" },

{ id:"肤2", name:"白桦林间",
  note:"你选的 树4白桦 ×6，配 帐3 复古条纹帆布帐；草地调成桦林特有的黄绿，木框换浅桦木色",
  ground:"#9cc266", cellBorder:"rgba(255,255,255,.25)", cellBorder2:"rgba(0,0,0,.06)",
  frame:["#ddcba2","#c3ab78"], chip:["#b98f56","#9e7743"], chipDone:["#7cb856","#5b9a3e"],
  trees:["birch"], boardTrees:["birch","birch","birch","birch","birch","birch"], tent:"striped" },

{ id:"肤3", name:"金色草原",
  note:"你选的 帐5 草原 tipi 帐；树配新画的金合欢（草原伞形树冠），草地换成干草金绿",
  ground:"#b8ac60", cellBorder:"rgba(255,255,255,.28)", cellBorder2:"rgba(0,0,0,.07)",
  frame:["#c9a05e","#a87f42"], chip:["#a07b3f","#85632f"], chipDone:["#8fae4e","#6f8f3a"],
  trees:["acacia"], boardTrees:["acacia","acacia","acacia","acacia","acacia","acacia"], tent:"tipi" },

{ id:"肤4", name:"荒漠绿洲",
  note:"原椰林海滩的沙漠版：细沙色草地保留，椰子树换成新画的仙人掌（巨柱+团扇混植），帐篷改金黄条纹沙漠帐，木框换红岩色，完成章换仙人掌绿",
  ground:"#ecd796", cellBorder:"rgba(0,0,0,.08)", cellBorder2:"rgba(255,255,255,.5)",
  frame:["#cd8f63","#a5613f"], chip:["#b07046","#8f5630"], chipDone:["#7fae54","#5f8f3e"],
  trees:["cactus","pear"], boardTrees:["cactus","pear","cactus","pear","cactus","pear"], tent:"desert" },

  note:"彩蛋方案：松树变夜色剪影+萤火虫点，帐篷门缝透出暖灯光（帐1 的夜光版）；草地换夜绿，木框换深蓝夜色",

/* 棋盘布局：帐篷靠近树，接近真实关卡观感 */
const LAYOUT = [
  {kind:"v",   x:0, y:0, w:1, h:2},
  {kind:"tree",x:1, y:0},
  {kind:"tree",x:4, y:0},
  {kind:"h",   x:2, y:2, w:2, h:1},
  {kind:"tree",x:2, y:3},
  {kind:"s",   x:5, y:3},
  {kind:"tree",x:5, y:4},
  {kind:"s",   x:1, y:5},
  {kind:"tree",x:0, y:5},
  {kind:"tree",x:4, y:5},
];

/* ============ 渲染 ============ */
function svgOf(str, w, h){
  const d = document.createElement("div");
  d.innerHTML = str;
  const s = d.firstChild;
  s.style.width = w + "px"; s.style.height = h + "px";
  return s;
}
function grassTile(svgStr, size, skin, alt){
  const g = document.createElement("div");
  g.className = "grass" + (alt ? " alt" : "");
  g.style.width = size + "px"; g.style.height = size + "px";
  g.style.setProperty("--ground", skin.ground);
  g.style.setProperty("--cellborder", skin.cellBorder);
  g.style.setProperty("--cellborder2", skin.cellBorder2);
  g.innerHTML = svgStr;
  g.firstChild.removeAttribute("style");
  return g;
}
function figWith(el, label){
  const f = document.createElement("div"); f.className = "fig";
  f.appendChild(el);
  const l = document.createElement("div"); l.className = "lab"; l.textContent = label;
  f.appendChild(l);
  return f;
}
function chipEl(colors, text, done){
  const c = document.createElement("div");
  c.className = "chipdemo";
  c.style.background = `linear-gradient(${colors[0]},${colors[1]})`;
  c.textContent = text;
  return c;
}

const wrap = document.getElementById("skins");
SKINS.forEach(sk => {
  const card = document.createElement("div");
  card.className = "skin";
  card.innerHTML = `<div class="ttl"><span class="badge">${sk.id}</span><span class="name">${sk.name}</span><span class="note">${sk.note}</span></div>`;

  /* 配色板 */
  const pal = document.createElement("div"); pal.className = "palette";
  pal.innerHTML =
    `<span class="sw"><i style="background:${sk.ground}"></i>草地</span>` +
    `<span class="sw"><i style="background:linear-gradient(145deg,${sk.frame[0]},${sk.frame[1]})"></i>木框</span>`;
  const p1 = document.createElement("span"); p1.className = "sw";
  p1.appendChild(chipEl(sk.chip, "3"));
  p1.appendChild(chipEl(sk.chipDone, "✓"));
  p1.appendChild(Object.assign(document.createElement("span"), {textContent:"数字徽章/完成章"}));
  pal.appendChild(p1);
  card.appendChild(pal);

  /* 素材台 */
  const stage = document.createElement("div"); stage.className = "stage";
  const trow = document.createElement("div"); trow.className = "treerow";
  sk.trees.forEach((tk, i) => trow.appendChild(grassTile(TREE[tk], 48, sk, i % 2 === 1)));
  stage.appendChild(figWith(trow, sk.trees.length > 1 ? "树组（本皮肤混植）" : "树"));
  const t = TENT[sk.tent];
  stage.appendChild(figWith(svgOf(t.s, 90, 90), "单帐"));
  stage.appendChild(figWith(svgOf(t.h, 180, 90), "横双帐"));
  stage.appendChild(figWith(svgOf(t.v, 90, 180), "竖双帐"));
  card.appendChild(stage);

  /* 6×6 主题棋盘 */
  const demo = document.createElement("div");
  demo.className = "boarddemo";
  demo.style.background = `linear-gradient(145deg,${sk.frame[0]},${sk.frame[1]})`;
  const grid = document.createElement("div");
  grid.className = "minigrid";
  grid.style.width = 6 * CELL + "px"; grid.style.height = 6 * CELL + "px";
  grid.style.background = sk.ground;
  grid.style.boxShadow = "inset 0 0 0 2px rgba(0,0,0,.09)";
  for(let r = 0; r < 6; r++) for(let c = 0; c < 6; c++){
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.left = c * CELL + "px"; cell.style.top = r * CELL + "px";
    cell.style.width = CELL + "px"; cell.style.height = CELL + "px";
    const alt = (r + c) % 2 === 1;
    cell.style.boxShadow = `inset 0 0 0 1px ${alt ? sk.cellBorder2 : sk.cellBorder}`;
    grid.appendChild(cell);
  }
  LAYOUT.forEach((it, idx) => {
    const p = document.createElement("div"); p.className = "placed";
    p.style.left = it.x * CELL + "px"; p.style.top = it.y * CELL + "px";
    p.style.width = (it.w || 1) * CELL + "px"; p.style.height = (it.h || 1) * CELL + "px";
    if(it.kind === "tree"){
      const tk = sk.boardTrees[(idx + it.x) % sk.boardTrees.length];
      p.innerHTML = TREE[tk];
    } else {
      p.innerHTML = t[it.kind];
    }
    grid.appendChild(p);
  });
  demo.appendChild(grid);
  card.appendChild(demo);
  wrap.appendChild(card);
});
</script>
